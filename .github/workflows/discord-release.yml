# Annonce chaque release publiée sur le Discord ZoomerMod (webhook dans le secret DISCORD_WEBHOOK).
# Lancement à la main (onglet Actions) : réannonce une release existante, la dernière par défaut.
name: Annonce Discord

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à annoncer (vide : dernière release)"
        required: false

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Poster sur Discord
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "$WEBHOOK" ]; then echo "Secret DISCORD_WEBHOOK absent"; exit 1; fi
          gh release view ${TAG:+"$TAG"} -R "$GITHUB_REPOSITORY" --json name,tagName,body,url,assets > release.json
          # Notes en deux langues : le français, puis une section "## English" (facultative), postée dans un 2e message.
          # Embed : titre, notes (limite Discord 4096 caractères), liens de téléchargement directs.
          cat > notes.jq <<'EOF'
          .url as $u
          | (.body | gsub("\r"; "") | split("\n## English")) as $parts
          | (if $lang == "fr" then $parts[0] else ($parts[1:] | join("\n## English") | sub("^[^\n]*\n"; "")) end) as $notes
          | {
              username: "ZoomerMod",
              embeds: [{
                title: ("🚀 " + .name),
                url: .url,
                color: 16753920,
                description: (if ($notes | length) > 3800
                  then $notes[0:3800] + (if $lang == "fr" then "\n\n… suite sur GitHub" else "\n\n… more on GitHub" end)
                  else $notes end),
                fields: [{
                  name: (if $lang == "fr" then "Télécharger" else "Download" end),
                  value: ([.assets[] | "[\(.name)](\(.url))"] | join("\n") | if . == "" then $u else . end)
                }]
              }]
            }
          EOF
          post() {   # $1 : fr | en
            jq --arg lang "$1" -f notes.jq release.json > payload.json
            curl -fsS -H "Content-Type: application/json" -d @payload.json "$WEBHOOK"
          }
          post fr
          if jq -e '.body | gsub("\r"; "") | test("\n## English")' release.json > /dev/null; then post en; else echo "Pas de section ## English"; fi
          echo "Annoncé : $(jq -r .tagName release.json)"
